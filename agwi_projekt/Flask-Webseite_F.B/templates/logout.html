<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Bestätigung</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Dezentes Grau */
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-logout {
            background-color: #dc3545;
            border: none;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
        .btn-cancel {
            background-color: #6c757d;
            border: none;
        }
        .btn-cancel:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card text-center p-4">
        <h1 class="mb-4 text-danger">Möchten Sie sich wirklich ausloggen?</h1>
        <p class="text-muted mb-4">Durch das Ausloggen wird Ihre Sitzung beendet. Sie können sich später erneut einloggen.</p>
        <div class="d-flex justify-content-around">
            <!-- Cancel Button -->
            <a href="/loggedin" class="btn btn-cancel btn-lg px-5">Abbrechen</a>
            <!-- Logout Button -->
            <a href="/" class="btn btn-logout btn-lg px-5">Ausloggen</a>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
