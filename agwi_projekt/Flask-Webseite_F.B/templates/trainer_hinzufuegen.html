<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Hinzufügen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Trainer-Buchungs-Website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Startseite</a></li>
                    <li class="nav-item"><a class="nav-link" href="/hallen">Hallen</a></li>
                    <li class="nav-item"><a class="nav-link" href="/trainer">Trainer</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mt-5">
        <h2 class="text-center">Neuen Trainer Hinzufügen</h2>
        <form action="/trainer/hinzufuegen" method="POST" class="mt-4">
            <!-- Name des Trainers -->
            <div class="mb-3">
                <label for="name" class="form-label">Name des Trainers</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Name des Trainers" required>
            </div>

            <!-- E-Mail -->
            <div class="mb-3">
                <label for="email" class="form-label">E-Mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="E-Mail-Adresse" required>
            </div>

            <!-- Bild-URL -->
            <div class="mb-3">
                <label for="image_url" class="form-label">Bild-URL</label>
                <input type="url" class="form-control" id="image_url" name="image_url" placeholder="URL des Bildes" required>
            </div>

            <!-- Geburtstag -->
            <div class="mb-3">
                <label for="birthday" class="form-label">Geburtstag</label>
                <input type="date" class="form-control" id="birthday" name="birthday" required>
            </div>

            <!-- Bewertung -->
            <div class="mb-3">
                <label for="bewertung" class="form-label">Bewertung</label>
                <input type="number" class="form-control" id="bewertung" name="bewertung" placeholder="Bewertung (1-5)" min="1" max="5" required>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-success">Trainer Hinzufügen</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
